<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071321"><title>NEXORA | Admin</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"><style>
body{min-height:100vh}.admin-wrap{width:min(1050px,94%);margin:35px auto}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}.panel{background:#0c1d30;border:1px solid #1b3549;border-radius:16px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}input,textarea,select{width:100%;padding:12px;border:1px solid #29465b;border-radius:9px;background:#071321;color:#edf5f8;font:inherit}textarea{min-height:95px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#43e1d0;color:#06202a}.record{display:flex;align-items:center;gap:14px;padding:12px;border-bottom:1px solid #1b3549}.record img{width:72px;height:55px;object-fit:cover;border-radius:8px}.record .meta{flex:1}.record small{display:block;color:#9aafc0}.record-actions{display:flex;gap:6px}.danger{border-color:#8e3843;color:#ff9aa5}.notice{color:#43e1d0;min-height:25px}.hidden{display:none!important}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}.record{align-items:flex-start;flex-wrap:wrap}.record-actions{width:100%}}
</style></head><body><header class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.svg"><span>NEXORA<small>DIGITAL STUDIO</small></span></a><a href="index.html" class="link">العودة للموقع ↗</a></header>
<main class="admin-wrap"><div class="admin-head"><div><label>CONTROL CENTER</label><h1 style="font-size:34px;margin:5px 0">لوحة إدارة NEXORA</h1><p>إدارة القوالب والخدمات ومحتوى الموقع.</p></div><button id="logout" class="hidden">تسجيل الخروج</button></div>
<section id="login" class="panel"><h2>تسجيل دخول الإدارة</h2><p>الدخول متاح لحساب مدير المنصة فقط.</p><form id="loginForm" class="form-grid"><label class="field">البريد الإلكتروني<input id="email" type="email" required autocomplete="username"></label><label class="field">كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><div class="field full"><button class="btn" type="submit">دخول آمن</button><div id="loginMsg" class="notice"></div></div></form></section>
<section id="dashboard" class="hidden"><div class="tabs"><button data-tab="templates" class="active">القوالب</button><button data-tab="services">الخدمات</button><button data-tab="settings">إعدادات الموقع</button></div>
<section id="templates" class="panel tab-panel"><h2>إدارة القوالب</h2><form id="templateForm" class="form-grid"><input type="hidden" id="tId"><label class="field">اسم القالب<input id="tTitle" required></label><label class="field">الرابط المختصر (slug)<input id="tSlug" required placeholder="restaurant-demo"></label><label class="field">التصنيف<input id="tCategory" value="general"></label><label class="field">حالة النشر<select id="tStatus"><option value="draft">مسودة</option><option value="published">منشور</option><option value="hidden">مخفي</option></select></label><label class="field full">وصف مختصر<textarea id="tDescription"></textarea></label><label class="field">صورة الغلاف<input id="tImage" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="field">رابط معاينة القالب<input id="tPreview" type="url" placeholder="https://..."></label><label class="field">رابط النسخة التجريبية<input id="tDemo" type="url" placeholder="https://..."></label><label class="field">التقنيات (افصل بينها بفاصلة)<input id="tStack" placeholder="HTML, CSS, JavaScript"></label><label class="field"><span>ترتيب العرض</span><input id="tOrder" type="number" value="0"></label><label class="field"><span><input id="tFeatured" type="checkbox" style="width:auto"> قالب مميز</span></label><div class="field full"><button class="btn" type="submit">حفظ القالب</button><button type="button" id="tReset">تفريغ الحقول</button><div id="tMsg" class="notice"></div></div></form><div id="templateList"></div></section>
<section id="services" class="panel tab-panel hidden"><h2>إدارة الخدمات</h2><form id="serviceForm" class="form-grid"><input type="hidden" id="sId"><label class="field">اسم الخدمة<input id="sTitle" required></label><label class="field">الرابط المختصر<input id="sSlug" required placeholder="ecommerce"></label><label class="field">الأيقونة (Lucide key)<input id="sIcon" value="sparkles"></label><label class="field">الحالة<select id="sStatus"><option value="draft">مسودة</option><option value="published">منشور</option><option value="hidden">مخفي</option></select></label><label class="field full">وصف مختصر<input id="sShort"></label><label class="field full">الوصف<textarea id="sDescription"></textarea></label><label class="field">السعر الابتدائي<input id="sPrice" type="number" min="0" step="0.01"></label><label class="field">العملة<select id="sCurrency"><option>IQD</option><option>USD</option></select></label><label class="field">ترتيب العرض<input id="sOrder" type="number" value="0"></label><label class="field"><span><input id="sFeatured" type="checkbox" style="width:auto"> خدمة مميزة</span></label><div class="field full"><button class="btn" type="submit">حفظ الخدمة</button><button type="button" id="sReset">تفريغ الحقول</button><div id="sMsg" class="notice"></div></div></form><div id="serviceList"></div></section>
<section id="settings" class="panel tab-panel hidden"><h2>إعدادات الموقع</h2><form id="settingsForm" class="form-grid"><label class="field">اسم الموقع<input id="siteName"></label><label class="field">الشعار النصي<input id="tagline"></label><label class="field">البريد<input id="contactEmail" type="email"></label><label class="field">رابط واتساب<input id="whatsapp"></label><label class="field">رابط إنستغرام<input id="instagram"></label><label class="field">اللغة الافتراضية<select id="locale"><option value="ar">العربية</option><option value="en">English</option></select></label><div class="field full"><button class="btn" type="submit">حفظ الإعدادات</button><div id="settingsMsg" class="notice"></div></div></form></section>
</section></main><script type="module" src="admin.js"></script></body></html>
