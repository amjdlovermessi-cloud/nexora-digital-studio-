<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنيو الإلكتروني</title><style>body{margin:0;background:#f4f6f8;color:#172638;font-family:Tahoma,Arial}.wrap{max-width:900px;margin:auto;padding:18px}.head,.item{background:white;border:1px solid #e4eaf0;border-radius:14px;padding:16px;margin-bottom:12px}.head{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.item b{display:block;font-size:16px}.price{color:#08796f;font-weight:bold;margin-top:10px}.muted{color:#748197;font-size:12px}@media(max-width:600px){.wrap{padding:10px}}</style></head><body><main class="wrap"><header class="head"><h2 id="name">المنيو</h2><p class="muted">القائمة الرقمية</p></header><div id="menu" class="grid"></div><p id="msg" class="muted"></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.81.1';const sb=createClient('https://gghlmpxmiivrkiltydxf.supabase.co','sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h');const slug=new URLSearchParams(location.search).get('tenant');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!slug){document.getElementById('msg').textContent='رابط المنيو غير صحيح.';}else{const{data,error}=await sb.from('nexora_public_menus').select('*').eq('tenant_slug',slug);if(error||!data?.length){document.getElementById('msg').textContent='المنيو غير متاح حالياً أو لم تتم إضافة أصناف بعد.';}else{document.getElementById('name').textContent=data[0].display_name;document.title=data[0].display_name+' | المنيو';document.getElementById('menu').innerHTML=data.map(x=>'<article class="item"><b>'+esc(x.data.name)+'</b><span class="muted">'+esc(x.data.category||'')+'</span><div class="price">'+Number(x.data.price||0).toLocaleString('en-US')+' د.ع</div></article>').join('');}}</script></body></html>
