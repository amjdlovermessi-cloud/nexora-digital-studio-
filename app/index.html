<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>NEXORA | بوابة العميل</title>
<style>
:root{--navy:#101b2b;--teal:#12877d;--bg:#f3f6f8;--ink:#182638;--muted:#728095;--line:#e4eaf0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;cursor:pointer;font-weight:bold}button.secondary{background:#e8f2f2;color:#126b65}button.danger{background:#a33}.wrap{max-width:1180px;margin:auto;padding:18px}.card,.top,.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.muted,.hint{color:var(--muted);font-size:12px;line-height:1.8}.layout{display:grid;grid-template-columns:205px 1fr;gap:14px;margin-top:14px}.side{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;height:max-content}.side button{display:block;width:100%;text-align:right;background:transparent;color:#4b5a6d;margin:3px 0}.side button.active{background:#e7f6f4;color:#08796f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}.stat b{display:block;font-size:23px;margin-top:5px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-items:end}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white}.field textarea{min-height:65px}.full{grid-column:1/-1}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:520px}td,th{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:12px}.mutedtag{display:inline-block;padding:5px 9px;border-radius:20px;background:#eaf7f5;color:#08796f;font-size:11px}.hidden{display:none!important}.auth{max-width:520px;margin:50px auto}.auth form{display:grid;gap:10px}.notice{margin-top:9px;font-size:12px;color:#a34;line-height:1.8}.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.item b{display:block;margin-bottom:6px}.actions{display:flex;gap:6px;flex-wrap:wrap}.cartline{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line)}
#printInvoice{display:none}
@media print{
  body.printing-invoice{background:#fff!important}
  body.printing-invoice>*{display:none!important}
  body.printing-invoice #invoicePrint{display:block!important;position:absolute;inset:0;width:100%;padding:24px;color:#111;background:#fff;font-family:Tahoma,Arial,sans-serif}
  #invoicePrint h1,#invoicePrint h2{text-align:center;margin:5px 0}
  #invoicePrint .inv-meta{display:flex;justify-content:space-between;gap:12px;margin:18px 0;font-size:12px}
  #invoicePrint table{width:100%;min-width:0;border-collapse:collapse;margin-top:18px}
  #invoicePrint th,#invoicePrint td{border:1px solid #ddd;padding:9px;text-align:right;font-size:12px}
  #invoicePrint .inv-total{text-align:left;font-size:18px;font-weight:bold;margin-top:18px}
  #invoicePrint .inv-foot{text-align:center;margin-top:35px;font-size:11px;color:#555}
}.foot{text-align:center;padding:20px;color:var(--muted);font-size:11px}@media(max-width:700px){.wrap{padding:10px}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.form{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:18px}.top{align-items:flex-start}}
 .password-wrap{position:relative;display:flex;align-items:center}.password-wrap input{width:100%;padding-left:52px!important}.password-toggle{position:absolute;left:5px;top:50%;transform:translateY(-50%);padding:7px 10px;background:transparent;color:#536276;font-size:18px;line-height:1}.password-toggle:hover{background:#eef3f6}</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">NEXORA</div><div class="muted" id="tenantTitle">بوابة العميل</div></div><div class="actions"><span class="mutedtag" id="tenantType">مساحة خاصة</span><button id="logout" class="secondary hidden">تسجيل الخروج</button></div></header>
<section id="auth" class="card auth"><h2 id="authTitle">تسجيل الدخول إلى نظامك</h2><p class="muted" id="authIntro">أدخل البريد وكلمة المرور التي أنشأتها عند استلام رابط الدعوة.</p><form id="authForm"><div class="field"><label for="authMethod">طريقة الدخول</label><select id="authMethod"><option value="email">البريد الإلكتروني</option><option value="username">اسم المستخدم بدون بريد</option><option value="phone">رقم الهاتف</option></select></div><div class="field"><label id="identifierLabel" for="identifier">البريد الإلكتروني</label><input id="identifier" type="text" required autocomplete="username" placeholder="name@example.com"></div><div class="field"><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" type="password" required minlength="8" autocomplete="current-password"><button id="togglePassword" class="password-toggle" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false">👁</button></div><div class="hint">8 أحرف على الأقل، وتحتوي حرفاً إنجليزياً صغيراً وكبيراً ورقماً.</div></div><button id="authSubmit">دخول</button><button id="toggleAuth" class="secondary" type="button">إنشاء حساب جديد</button><div id="authMsg" class="notice"></div></form><form id="phoneOtpForm" class="hidden"><div class="field"><label for="phoneOtp">رمز التحقق المرسل برسالة SMS</label><input id="phoneOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div><button type="submit">تأكيد الرقم وإكمال التفعيل</button><div id="phoneOtpMsg" class="notice"></div><button id="backToAuth" class="secondary" type="button">رجوع</button></form></section>
<section id="workspace" class="hidden"><div class="stats"><div class="stat"><span class="muted">السجلات</span><b id="totalCount">0</b></div><div class="stat"><span class="muted">نوع النظام</span><b id="typeStat" style="font-size:15px">-</b></div><div class="stat"><span class="muted">حالة الوصول</span><b style="font-size:15px">فعال</b></div></div><div class="layout"><nav class="side" id="tabs"></nav><section class="card" id="panel"></section></div></section>
<p class="foot">NEXORA Digital Studio · مساحة خاصة بالعميل</p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const sb=createClient('https://gghlmpxmiivrkiltydxf.supabase.co','sb_publishable_-oLYi0Su5SXOGmQBuZcvcw_TIHJ1D8h');
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let slug=params.get('tenant');const invite=params.get('invite');
const labels={restaurant:'نظام إدارة المطاعم',cafe:'نظام إدارة الكافيهات',clinic:'نظام إدارة العيادات',pharmacy:'نظام إدارة الصيدليات'};
const configs={
 restaurant:[['home','الرئيسية'],['menu','المنيو الإلكتروني'],['cashier','الكاشير'],['orders','الطلبات'],['tables','الطاولات']],
 cafe:[['home','الرئيسية'],['menu','قائمة المشروبات'],['cashier','الكاشير'],['orders','الطلبات'],['tables','الطاولات']],
 clinic:[['home','الرئيسية'],['patients','المراجعين'],['appointments','المواعيد']],
 pharmacy:[['home','الرئيسية'],['inventory','المخزون والأدوية'],['sales','المبيعات']]
};
let isSignup=false,user=null,tenant=null,records=[],active='home',cart=[],editingId=null,lastInvoice=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=(id,s)=>$(id).textContent=s||'';
let pendingPhone='';
function syntheticEmail(username){return username.trim().toLowerCase()+'@nexora-login.invalid';}
function normalizedPhone(value){let p=value.replace(/[\s()-]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);if(p.startsWith('07'))p='+964'+p.slice(1);else if(p.startsWith('964'))p='+'+p;return p;}
function authMode(){const method=$('authMethod').value;$('authTitle').textContent=isSignup?'إنشاء حساب العميل':'تسجيل الدخول إلى نظامك';$('authSubmit').textContent=isSignup?'إنشاء الحساب':'دخول';$('toggleAuth').textContent=isSignup?'لدي حساب بالفعل':'إنشاء حساب جديد';$('authIntro').textContent=invite?'هذا رابط تفعيل خاص بك. أنشئ حساباً ثم أكمل تفعيل الدعوة.':'اختر طريقة الدخول المناسبة لك.';$('identifierLabel').textContent=method==='email'?'البريد الإلكتروني':method==='phone'?'رقم الهاتف':'اسم المستخدم';$('identifier').type=method==='email'?'email':'text';$('identifier').autocomplete=method==='phone'?'tel':method==='username'?'username':'email';$('identifier').placeholder=method==='email'?'name@example.com':method==='phone'?'+9647XXXXXXXXX':'مثال: amjad_2006';}
$('authMethod').onchange=()=>{authMode();say('authMsg','');};
$('togglePassword').onclick=()=>{const field=$('password'),show=field.type==='password';field.type=show?'text':'password';$('togglePassword').textContent=show?'🙈':'👁';$('togglePassword').setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور');$('togglePassword').setAttribute('aria-pressed',String(show));};
$('toggleAuth').onclick=()=>{isSignup=!isSignup;authMode();say('authMsg','');};
$('backToAuth').onclick=()=>{$('phoneOtpForm').classList.add('hidden');$('authForm').classList.remove('hidden');};
async function start(){
 if(!slug){say('authMsg','رابط النظام غير مكتمل. اطلب رابطك من NEXORA.');return;}
 const {data:{session}}=await sb.auth.getSession();
 if(session){user=session.user;await afterLogin();}
 else {$('auth').classList.remove('hidden');authMode();if(invite){isSignup=true;authMode();}}
}
$('authForm').onsubmit=async e=>{
 e.preventDefault();say('authMsg','جارٍ التحقق...');
 const method=$('authMethod').value,identifier=$('identifier').value.trim(),password=$('password').value;
 let result;
 try{
  if(method==='username'){
   const username=identifier.toLowerCase();
   if(!/^[a-z0-9_.]{3,24}$/.test(username)){say('authMsg','اسم المستخدم يجب أن يكون 3 إلى 24 حرفاً إنجليزياً أو رقماً أو _ أو .');return;}
   if(isSignup){
    const {data,error}=await sb.functions.invoke('nexora-username-register',{body:{username,password}});
    if(error||data?.error){say('authMsg','تعذر إنشاء الحساب: '+(data?.error||error?.message||'حدث خطأ'));return;}
   }
   result=await sb.auth.signInWithPassword({email:syntheticEmail(username),password});
  }else if(method==='phone'){
   const phone=normalizedPhone(identifier);
   if(!/^\+[1-9]\d{7,14}$/.test(phone)){say('authMsg','أدخل رقم الهاتف مع رمز الدولة، مثال: +9647XXXXXXXXX');return;}
   result=isSignup?await sb.auth.signUp({phone,password}):await sb.auth.signInWithPassword({phone,password});
   if(isSignup&&!result.error&&!result.data.session){
    pendingPhone=phone;$('authForm').classList.add('hidden');$('phoneOtpForm').classList.remove('hidden');say('phoneOtpMsg','أرسلنا رمز تحقق إلى هاتفك. أدخله لإكمال إنشاء الحساب.');return;
   }
  }else{
   result=isSignup?await sb.auth.signUp({email:identifier,password}):await sb.auth.signInWithPassword({email:identifier,password});
  }
  if(result.error){say('authMsg','تعذر إكمال العملية: '+result.error.message);return;}
  if(isSignup&&method==='email'&&!result.data.session){say('authMsg','تم إنشاء الحساب. تحقق من بريدك الإلكتروني، ثم افتح رابط الدعوة نفسه وسجّل الدخول لإكمال التفعيل.');return;}
  user=result.data.user;await afterLogin();
 }catch(err){say('authMsg','تعذر إكمال العملية: '+(err.message||'حدث خطأ غير متوقع'));}
};
$('phoneOtpForm').onsubmit=async e=>{e.preventDefault();say('phoneOtpMsg','جارٍ تأكيد رقم الهاتف...');const {data,error}=await sb.auth.verifyOtp({phone:pendingPhone,token:$('phoneOtp').value.trim(),type:'sms'});if(error){say('phoneOtpMsg','تعذر تأكيد الرقم: '+error.message);return;}user=data.user;await afterLogin();};
async function afterLogin(){
 if(invite){const {data,error}=await sb.rpc('redeem_nexora_invite',{p_invite_code:invite});if(error){say('authMsg','تعذر تفعيل الدعوة: '+error.message);return;}slug=data[0].tenant_slug;history.replaceState({},'', '?tenant='+encodeURIComponent(slug));}
 const {data,error}=await sb.from('nexora_tenants').select('*').eq('slug',slug).maybeSingle();
 if(error||!data){say('authMsg','لا تملك صلاحية الدخول إلى هذا النظام أو أن الاشتراك غير فعال. تواصل مع NEXORA.');$('auth').classList.remove('hidden');return;}
 tenant=data;
 $('auth').classList.add('hidden');$('workspace').classList.remove('hidden');$('logout').classList.remove('hidden');
 $('tenantTitle').textContent=tenant.display_name+' · '+labels[tenant.product_type];$('tenantType').textContent=labels[tenant.product_type];$('typeStat').textContent=tenant.product_type;
 renderTabs();await render();
}
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
function renderTabs(){ $('tabs').innerHTML=configs[tenant.product_type].map(([id,label])=>'<button data-tab="'+id+'" class="'+(active===id?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{active=b.dataset.tab;cart=[];renderTabs();await render();});}
async function fetchRecords(type){const {data,error}=await sb.from('nexora_tenant_records').select('*').eq('tenant_id',tenant.id).eq('record_type',type).order('created_at',{ascending:false});if(error)throw error;return data||[];}
async function addRecord(type,data){const {error}=await sb.from('nexora_tenant_records').insert({tenant_id:tenant.id,record_type:type,data,created_by:user.id});if(error)throw error;}
async function removeRecord(id){const {error}=await sb.from('nexora_tenant_records').delete().eq('id',id);if(error)throw error;}
async function updateRecord(id,data){const {error}=await sb.from('nexora_tenant_records').update({data,updated_at:new Date().toISOString()}).eq('id',id);if(error)throw error;}
function formHtml(fields,button='إضافة'){return '<form id="recordForm" class="form">'+fields.map(([k,l,type='text',required=true])=>'<div class="field"><label>'+l+'</label><input name="'+k+'" type="'+type+'" '+(required?'required':'')+'></div>').join('')+'<div class="field"><button type="submit">'+button+'</button></div></form><div id="formMsg" class="notice"></div>';}
function tableHtml(rows,cols){return '<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>إجراء</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r.data[c[0]])+'</td>').join('')+'<td><div class="actions"><button class="secondary" data-edit="'+r.id+'" style="padding:6px 9px">تعديل</button><button class="danger" data-delete="'+r.id+'" style="padding:6px 9px">حذف</button></div></td></tr>').join('')+'</tbody></table></div>';}
function expiryAlerts(rows){
 const today=new Date();today.setHours(0,0,0,0);
 const due=rows.filter(r=>r.data.expiry).map(r=>{const d=new Date(r.data.expiry+'T00:00:00');return {...r,days:Math.ceil((d-today)/86400000)};}).filter(r=>r.days<=10).sort((a,b)=>a.days-b.days);
 if(!due.length)return '<div class="item" style="margin:12px 0;border-color:#cfe8df"><b style="color:#08796f">لا توجد أدوية قاربت على الانتهاء</b><span class="muted">سيظهر التنبيه تلقائياً عند بقاء 10 أيام أو أقل.</span></div>';
 return '<div class="item" style="margin:12px 0;border-color:#f0c9c9;background:#fffafa"><b style="color:#a33">تنبيهات تواريخ الانتهاء ('+due.length+')</b>'+due.map(r=>'<div style="padding:9px 0;border-top:1px solid #f1dddd"><strong>'+esc(r.data.name)+'</strong> · '+(r.days<0?'<span style="color:#a33">منتهي منذ '+Math.abs(r.days)+' يوم</span>':r.days===0?'<span style="color:#a33">ينتهي اليوم</span>':'<span style="color:#a65b00">متبقي '+r.days+' يوم</span>')+'<div class="muted">تاريخ الانتهاء: '+esc(r.data.expiry)+' · الكمية: '+esc(r.data.quantity??'غير محددة')+'</div></div>').join('')+'</div>';
}
async function simpleModule(title,type,fields,cols){const rows=await fetchRecords(type);records=rows;editingId=null;$('totalCount').textContent=rows.length;$('panel').innerHTML='<h2>'+title+'</h2>'+(type==='inventory_item'?expiryAlerts(rows):'')+'<input id="recordId" type="hidden">'+formHtml(fields)+tableHtml(rows,cols);$('recordForm').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.currentTarget).entries());if(type==='menu_item')d.is_available=!!e.currentTarget.elements.is_available.checked;if(d.price)d.price=Number(d.price);if(d.quantity)d.quantity=Number(d.quantity);if(editingId)await updateRecord(editingId,d);else await addRecord(type,d);editingId=null;await render();}catch(err){say('formMsg',err.message);}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const row=rows.find(x=>x.id===b.dataset.edit);if(!row)return;editingId=row.id;$('recordId').value=row.id;for(const [k] of fields){const input=e=>e.elements[k];if(input($('recordForm'))){if(input($('recordForm')).type==='checkbox')input($('recordForm')).checked=!!row.data[k];else input($('recordForm')).value=row.data[k]??'';}}$('recordForm').scrollIntoView({behavior:'smooth'});});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('حذف هذا السجل؟')){await removeRecord(b.dataset.delete);await render();}});}
async function render(){
 if(active==='home'){const types=tenant.product_type==='restaurant'||tenant.product_type==='cafe'?['menu_item','order','table']:tenant.product_type==='clinic'?['patient','appointment']:['inventory_item','sale'];let counts=[];for(const t of types)counts.push((await fetchRecords(t)).length);$('totalCount').textContent=counts.reduce((a,b)=>a+b,0);const expiryHome=tenant.product_type==='pharmacy'?expiryAlerts(await fetchRecords('inventory_item')):'';$('panel').innerHTML='<h2>مرحباً بك في '+esc(tenant.display_name)+'</h2><p class="muted">هذه مساحة عملك الخاصة. استخدم القائمة للوصول إلى أقسام نظامك.</p>'+expiryHome+'<div class="menu-grid">'+configs[tenant.product_type].slice(1).map(x=>'<div class="item"><b>'+x[1]+'</b><span class="muted">إدارة وتشغيل من مكان واحد</span></div>').join('')+'</div>'+(tenant.product_type==='restaurant'||tenant.product_type==='cafe'?'<p style="margin-top:16px"><a href="../menu.html?tenant='+encodeURIComponent(tenant.slug)+'" target="_blank">فتح رابط المنيو العام للزبائن ↗</a></p><p class="muted">رابط المنيو: '+esc(location.origin+'/nexora-digital-studio-/menu.html?tenant='+tenant.slug)+'</p><img alt="QR المنيو" style="width:150px;max-width:100%;border:1px solid #eee;border-radius:10px;padding:6px" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(location.origin+'/nexora-digital-studio-/menu.html?tenant='+tenant.slug)+'">':'');return;}
 if(active==='menu'){await simpleModule('إدارة المنيو الإلكتروني','menu_item',[['name','اسم الصنف'],['category','القسم'],['price','السعر بالدينار','number'],['is_available','متاح؟','checkbox',false]], [['name','الصنف'],['category','القسم'],['price','السعر'],['is_available','متاح']]);return;}
 if(active==='orders'){await simpleModule('الطلبات','order',[['order_number','رقم الطلب'],['customer','اسم الزبون'],['phone','رقم الهاتف'],['items','تفاصيل الطلب'],['total','المجموع بالدينار','number'],['status','الحالة'],['notes','ملاحظات']], [['order_number','رقم الطلب'],['customer','الزبون'],['phone','الهاتف'],['items','الطلب'],['total','المجموع'],['status','الحالة'],['notes','ملاحظات']]);return;}
 if(active==='tables'){await simpleModule('الطاولات','table',[['name','رقم أو اسم الطاولة'],['status','الحالة']], [['name','الطاولة'],['status','الحالة']]);return;}
 if(active==='patients'){await simpleModule('المراجعين','patient',[['name','اسم المراجع'],['phone','الهاتف'],['notes','ملاحظات', 'text',false]], [['name','الاسم'],['phone','الهاتف'],['notes','ملاحظات']]);return;}
 if(active==='appointments'){await simpleModule('المواعيد','appointment',[['patient','اسم المراجع'],['service','نوع الموعد'],['date','التاريخ','date'],['time','الوقت'],['status','الحالة']], [['patient','المراجع'],['service','الخدمة'],['date','التاريخ'],['time','الوقت'],['status','الحالة']]);return;}
 if(active==='inventory'){await simpleModule('المخزون والأدوية','inventory_item',[['name','اسم الصنف'],['code','الرمز'],['quantity','الكمية','number'],['price','سعر البيع','number'],['expiry','تاريخ الانتهاء','date',false]], [['name','الصنف'],['code','الرمز'],['quantity','الكمية'],['price','السعر'],['expiry','الانتهاء']]);return;}
 if(active==='sales'){const stock=await fetchRecords('inventory_item'),sales=await fetchRecords('sale');$('totalCount').textContent=sales.length;$('panel').innerHTML='<h2>المبيعات</h2><p class="muted">سجّل بيعاً وسيتم خصم الكمية تلقائياً من المخزون.</p><form id="saleForm" class="form"><div class="field"><label>الصنف</label><select id="saleItem" required><option value="">اختر الصنف</option>'+stock.map(x=>'<option value="'+x.id+'">'+esc(x.data.name)+' · المتوفر '+Number(x.data.quantity||0)+'</option>').join('')+'</select></div><div class="field"><label>الكمية</label><input id="saleQty" type="number" min="1" value="1" required></div><div class="field"><label>التاريخ</label><input id="saleDate" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><button type="submit">تسجيل البيع وخصم المخزون</button></div></form><div id="saleMsg" class="notice"></div>'+tableHtml(sales,[['item','الصنف'],['quantity','الكمية'],['total','المبلغ'],['date','التاريخ']]);$('saleForm').onsubmit=async e=>{e.preventDefault();const item=stock.find(x=>x.id===$('saleItem').value),qty=Number($('saleQty').value);if(!item){say('saleMsg','اختر صنفاً صحيحاً.');return;}const available=Number(item.data.quantity)||0;if(qty<1||qty>available){say('saleMsg','الكمية المطلوبة أكبر من المتوفر في المخزون.');return;}try{const price=Number(item.data.price)||0;await updateRecord(item.id,{...item.data,quantity:available-qty});await addRecord('sale',{item:item.data.name,quantity:qty,total:price*qty,date:$('saleDate').value});await render();}catch(err){say('saleMsg','تعذر تسجيل البيع: '+err.message);}};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('حذف سجل البيع؟ لن يتم إرجاع الكمية تلقائياً للمخزون.')){await removeRecord(b.dataset.delete);await render();}});return;}
 if(active==='cashier'){
 const menu=(await fetchRecords('menu_item')).filter(m=>m.data.is_available!==false),orders=await fetchRecords('order');
 $('totalCount').textContent=orders.length;
 $('panel').innerHTML='<h2>الكاشير ونقطة البيع</h2><p class="muted">اختر الأصناف لإضافتها إلى الفاتورة ثم سجّل الطلب.</p><div class="menu-grid">'+menu.map(m=>'<div class="item"><b>'+esc(m.data.name)+'</b><span class="muted">'+esc(m.data.price)+' د.ع</span><button data-addcart="'+m.id+'" style="display:block;width:100%;margin-top:9px">إضافة للفاتورة</button></div>').join('')+'</div><div class="card" style="margin-top:14px"><h3>الفاتورة الحالية</h3><div id="cartLines"></div><div class="field"><label>اسم الزبون / رقم الطاولة</label><input id="cashCustomer" placeholder="اختياري"></div><h3 id="cartTotal">المجموع: 0 د.ع</h3><button id="checkout">تسجيل البيع والطلب</button><div id="cashMsg" class="notice"></div>'+(lastInvoice?'<button id="printLastInvoice" class="secondary" style="margin-top:10px">طباعة آخر فاتورة</button>':'')+'</div><div id="invoicePrint"></div>'+(menu.length?'':'<p class="notice">أضف أصنافاً إلى المنيو أولاً حتى تظهر هنا.</p>');
 function drawCart(){
  $('cartLines').innerHTML=cart.map((item,i)=>'<div class="cartline"><span>'+esc(item.name)+' × '+item.qty+'</span><span>'+ (item.price*item.qty).toLocaleString('en-US')+' د.ع <button data-remove-cart="'+i+'" class="danger">×</button></span></div>').join('');
  $('cartTotal').textContent='المجموع: '+cart.reduce((s,item)=>s+item.price*item.qty,0).toLocaleString('en-US')+' د.ع';
  document.querySelectorAll('[data-remove-cart]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.removeCart),1);drawCart();});
 }
 function printLastInvoice(){
  if(!lastInvoice)return;
  const inv=lastInvoice;
  $('invoicePrint').innerHTML='<h1>'+esc(tenant.display_name||'NEXORA')+'</h1><h2>فاتورة بيع</h2><div class="inv-meta"><span>رقم الفاتورة: '+esc(inv.number)+'</span><span>التاريخ: '+new Date(inv.created_at).toLocaleString('ar-IQ')+'</span></div><p>الزبون: '+esc(inv.customer)+'</p><table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+inv.lines.map(line=>'<tr><td>'+esc(line.name)+'</td><td>'+line.qty+'</td><td>'+line.price.toLocaleString('en-US')+' د.ع</td><td>'+(line.price*line.qty).toLocaleString('en-US')+' د.ع</td></tr>').join('')+'</tbody></table><div class="inv-total">المجموع: '+inv.total.toLocaleString('en-US')+' د.ع</div><div class="inv-foot">شكراً لزيارتكم</div>';
  document.body.classList.add('printing-invoice');
  const cleanup=()=>document.body.classList.remove('printing-invoice');
  window.addEventListener('afterprint',cleanup,{once:true});
  window.print();
  setTimeout(cleanup,1200);
 }
 drawCart();
 document.querySelectorAll('[data-addcart]').forEach(b=>b.onclick=()=>{const m=menu.find(x=>x.id===b.dataset.addcart);if(!m)return;const old=cart.find(x=>x.id===m.id);old?old.qty++:cart.push({id:m.id,name:m.data.name,price:Number(m.data.price)||0,qty:1});drawCart();});
 if(lastInvoice)$('printLastInvoice').onclick=printLastInvoice;
 $('checkout').onclick=async()=>{
  if(!cart.length){say('cashMsg','الفاتورة فارغة.');return;}
  try{
   const lines=cart.map(item=>({...item})),total=lines.reduce((sum,item)=>sum+item.price*item.qty,0),created_at=new Date().toISOString();
   const customer=$('cashCustomer').value.trim()||'زبون نقدي';
   const number='NX-'+created_at.replace(/[-:T.Z]/g,'').slice(0,14);
   const order={customer,items:lines.map(item=>item.name+' × '+item.qty).join('، '),lines,total,status:'جديد',invoice_number:number,created_at};
   await addRecord('order',order);
   lastInvoice={number,customer,lines,total,created_at};
   cart=[];
   await render();
   say('cashMsg','تم تسجيل البيع بنجاح. يمكنك طباعة الفاتورة الآن.');
  }catch(e){say('cashMsg','تعذر تسجيل البيع: '+e.message);}
 };
 return;
}
}
start();
</script></body></html>
