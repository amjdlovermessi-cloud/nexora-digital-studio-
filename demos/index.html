<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2b"><title>NEXORA | معاينة النظام</title>
<style>
:root{--navy:#101b2b;--teal:#12877d;--bg:#f3f6f8;--ink:#182638;--muted:#728095;--line:#e4eaf0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;cursor:pointer;font-weight:bold}.wrap{max-width:1180px;margin:auto;padding:20px}.top,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:15px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.muted{color:var(--muted);font-size:12px;line-height:1.8}.layout{display:grid;grid-template-columns:205px 1fr;gap:15px;margin-top:15px}.side,.panel{padding:16px}.side{background:#fff;border:1px solid var(--line);border-radius:15px;height:max-content}.side button{width:100%;text-align:right;margin:4px 0;background:transparent;color:#4d5c70}.side button.active{background:#e7f6f4;color:#08796f}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{padding:15px}.stat b{display:block;font-size:24px;margin-top:7px}.panel h2{font-size:17px;margin:0 0 13px}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}.tablewrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:550px}td,th{text-align:right;padding:11px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted)}.tag{display:inline-block;border-radius:20px;padding:5px 8px;background:#eaf7f5;color:#08796f;font-size:10px}.hidden{display:none!important}.notice{font-size:12px;color:var(--muted);margin-top:9px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:20px}@media(max-width:700px){.wrap{padding:11px}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:8px}.side button{white-space:nowrap;width:auto}.form{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:19px}.top{align-items:flex-start}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">NEXORA DIGITAL STUDIO</div><div id="subtitle" class="muted">قالب تجريبي تفاعلي</div></div><span class="tag">DEMO PREVIEW</span></header>
<div class="layout"><aside class="side" id="tabs"></aside><section>
<div class="stats"><div class="stat"><span class="muted" id="stat1label">السجلات</span><b id="stat1">0</b></div><div class="stat"><span class="muted" id="stat2label">اليوم</span><b id="stat2">0</b></div><div class="stat"><span class="muted">وضع العرض</span><b style="font-size:17px">تجريبي</b></div></div>
<div id="workspace" class="panel"></div><p class="notice">هذه معاينة بقيم تجريبية محفوظة على هذا الجهاز فقط. لا تدخل بيانات مرضى أو زبائن حقيقية. لا يتم إرسال أي بيانات إلى خوادم NEXORA.</p>
</section></div><div class="foot">NEXORA · Digital products for business</div></main>
<script>
const configs={
 restaurant:{name:'نظام إدارة المطاعم',subtitle:'إدارة الطلبات والمنيو والطاولات',tabs:[['orders','الطلبات'],['menu','المنيو'],['tables','الطاولات']],first:'الطلبات',fields:{orders:[['name','اسم الزبون'],['item','الطلب'],['amount','المبلغ'],['status','الحالة']],menu:[['name','اسم الطبق'],['category','القسم'],['price','السعر']],tables:[['name','رقم الطاولة'],['status','الحالة']]},seed:{orders:[{name:'طلب تجريبي 01',item:'وجبة دجاج',amount:'7500',status:'قيد التحضير'},{name:'طلب تجريبي 02',item:'برغر',amount:'6000',status:'جديد'}],menu:[{name:'وجبة دجاج',category:'وجبات رئيسية',price:'7500'},{name:'برغر',category:'سندويشات',price:'6000'}],tables:[{name:'1',status:'متاحة'},{name:'2',status:'مشغولة'}]}},
 cafe:{name:'نظام إدارة الكافيهات',subtitle:'إدارة الطاولات والطلبات والمشروبات',tabs:[['orders','الطلبات'],['menu','قائمة المشروبات'],['tables','الطاولات']],first:'الطلبات',fields:{orders:[['name','اسم الزبون'],['item','الطلب'],['amount','المبلغ'],['status','الحالة']],menu:[['name','اسم المشروب'],['category','القسم'],['price','السعر']],tables:[['name','رقم الطاولة'],['status','الحالة']]},seed:{orders:[{name:'طلب تجريبي 01',item:'لاتيه',amount:'5000',status:'قيد التحضير'}],menu:[{name:'لاتيه',category:'قهوة',price:'5000'},{name:'آيس كوفي',category:'بارد',price:'4500'}],tables:[{name:'1',status:'متاحة'},{name:'2',status:'مشغولة'}]}},
 clinic:{name:'نظام إدارة العيادات',subtitle:'إدارة المراجعين والمواعيد',tabs:[['appointments','المواعيد'],['patients','المراجعين']],first:'المواعيد',fields:{appointments:[['name','اسم المراجع التجريبي'],['service','نوع الموعد'],['date','التاريخ'],['status','الحالة']],patients:[['name','الاسم التجريبي'],['phone','الهاتف التجريبي'],['notes','ملاحظات']]},seed:{appointments:[{name:'مراجع تجريبي',service:'فحص عام',date:'2026-11-12',status:'مؤكد'}],patients:[{name:'مراجع تجريبي',phone:'07XXXXXXXXX',notes:'بيانات وهمية للمعاينة'}]}},
 pharmacy:{name:'نظام إدارة الصيدليات',subtitle:'إدارة الأدوية والمخزون والمبيعات',tabs:[['inventory','المخزون'],['sales','المبيعات']],first:'المخزون',fields:{inventory:[['name','اسم الصنف'],['code','الرمز'],['qty','الكمية'],['price','السعر']],sales:[['name','الصنف المباع'],['qty','الكمية'],['amount','المبلغ'],['date','التاريخ']]},seed:{inventory:[{name:'صنف تجريبي A',code:'MED-001',qty:'35',price:'2500'},{name:'صنف تجريبي B',code:'MED-002',qty:'12',price:'4000'}],sales:[{name:'صنف تجريبي A',qty:'2',amount:'5000',date:'2026-11-11'}]}}
};
const type=new URLSearchParams(location.search).get('type')||'restaurant',cfg=configs[type]||configs.restaurant,key='nexora-demo-'+type;
let data=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(cfg.seed),active=cfg.tabs[0][0];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('subtitle').textContent=cfg.name+' · '+cfg.subtitle;document.title='NEXORA | '+cfg.name;
function save(){localStorage.setItem(key,JSON.stringify(data))}
function renderTabs(){$('tabs').innerHTML=cfg.tabs.map(([id,label])=>'<button data-tab="'+id+'" class="'+(active===id?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}
function render(){renderTabs();const rows=data[active]||[],fields=cfg.fields[active];$('stat1label').textContent=cfg.tabs.find(x=>x[0]===active)[1];$('stat1').textContent=rows.length;$('stat2label').textContent='إجمالي الأقسام';$('stat2').textContent=cfg.tabs.length;
$('workspace').innerHTML='<h2>'+cfg.tabs.find(x=>x[0]===active)[1]+'</h2><form id="addForm" class="form">'+fields.map(([k,label])=>'<div class="field"><label>'+label+'</label><input name="'+k+'" placeholder="'+label+'" required></div>').join('')+'<button type="submit">إضافة سجل تجريبي</button></form><div class="tablewrap"><table><thead><tr>'+fields.map(x=>'<th>'+x[1]+'</th>').join('')+'<th>إجراء</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+fields.map(([k])=>'<td>'+esc(r[k])+'</td>').join('')+'<td><button data-del="'+i+'" style="padding:6px 9px;background:#a33">حذف</button></td></tr>').join('')+'</tbody></table></div>';
$('addForm').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.currentTarget).entries());data[active].unshift(obj);save();render()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{data[active].splice(Number(b.dataset.del),1);save();render()})}
render();
</script></body></html>
